# =============================================================================
#  HAProxy configuration for SIGEC-PJ HA
#  - Puerto 5000 → primario (escritura)
#  - Puerto 5001 → réplicas (lectura)
#  - Puerto 8443 → frontend HTTPS
#  - Puerto 7000 → stats
# =============================================================================

global
    log stdout local0
    daemon
    maxconn 4096
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

resolvers docker_dns
    nameserver dns1 127.0.0.11:53
    resolve_retries 10
    timeout resolve 2s
    timeout retry   2s
    hold valid 10s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  redispatch
    retries 3
    timeout connect 5000
    timeout client  50000
    timeout server  50000

# -------------------------------------------------------------------------
#  Estadísticas
# -------------------------------------------------------------------------
listen stats
    bind *:7000 name stats
    stats enable
    stats uri /
    stats refresh 10s
    stats show-legends
    stats show-node
    stats auth admin:admin123

# -------------------------------------------------------------------------
#  Puerto 5000 → primario PostgreSQL (escritura)
#  Health check via Patroni REST API (/primary, /replica, /standby_leader)
# -------------------------------------------------------------------------
backend pg_primary
    mode tcp
    balance first
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni-1 patroni-1:5432 maxconn 100 check port 8008
    server patroni-2 patroni-2:5432 maxconn 100 check port 8008 backup

frontend pg_primary_frontend
    mode tcp
    bind *:5000
    default_backend pg_primary

# -------------------------------------------------------------------------
#  Puerto 5001 → réplicas PostgreSQL (lectura)
# -------------------------------------------------------------------------
backend pg_replicas
    mode tcp
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni-1 patroni-1:5432 maxconn 100 check port 8008 backup
    server patroni-2 patroni-2:5432 maxconn 100 check port 8008

frontend pg_replicas_frontend
    mode tcp
    bind *:5001
    default_backend pg_replicas

# -------------------------------------------------------------------------
#  Balanceo para backends Spring Boot (active-active)
# -------------------------------------------------------------------------
backend spring_boot_backends
    balance roundrobin
    option httpchk GET /actuator/health
    http-check expect status 200
    default-server inter 5s fall 3 rise 2
    server backend-1 backend-1:8080 maxconn 100 check resolvers docker_dns init-addr none
    server backend-2 backend-2:8080 maxconn 100 check resolvers docker_dns init-addr none

# -------------------------------------------------------------------------
#  Frontend HTTPS (TLS 1.3) + proxy /api a backends
# -------------------------------------------------------------------------
frontend https_frontend
    bind *:8443 ssl crt /usr/local/etc/haproxy/certs/selfsigned.pem verify none alpn h2,http/1.1
    mode http
    option httplog
    option forwardfor
    http-request add-header X-Forwarded-Proto https

    # API REST → backends Spring Boot
    acl is_api path_beg /api
    use_backend spring_boot_backends if is_api

    # Assets estáticos → frontend nginx
    default_backend frontend_nginx

backend frontend_nginx
    balance roundrobin
    server frontend frontend:80 check resolvers docker_dns init-addr none
