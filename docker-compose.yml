# =============================================================================
#  SIGEC-PJ Fase 3 — Topología de Alta Disponibilidad Completa
#
#  Stack:
#    - etcd (1 nodo para demo): coordinador de clúster Patroni
#    - PostgreSQL 16 + Patroni (2 nodos): 1 primario + 1 réplica síncrona
#    - HAProxy: balanceo + TLS, puerto 5000 (escritura) + 5001 (lectura)
#    - pgBackRest: backup full + WAL archiving
#    - Spring Boot × 2 (active-active) detrás de HAProxy
#    - Vue.js + nginx: frontend servido con TLS
#
#  Uso:
#    docker compose up -d
#    docker compose logs -f patroni
#    docker exec -it sigec-patroni-1 patronictl list
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  #  etcd: coordinador de clúster para Patroni (1 nodo para demo)
  # ---------------------------------------------------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.13
    environment:
      ETCD_NAME: etcd1
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: sigec-patroni
    volumes:
      - etcd_data:/etcd
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  #  PostgreSQL 16 + Patroni: clúster HA (2 nodos)
  # ---------------------------------------------------------------------------
  patroni-1:
    image: postgres:16
    environment:
      POSTGRES_USER: sigec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      PATRONI_NAME: patroni-1
      PATRONI_SCOPE: sigec-cluster
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni-1:8008
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni-1:5432
      PATRONI_ETCD3_HOST: etcd
      PATRONI_ETCD3_PORT: 2379
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD}
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: ${REPLICATOR_PASSWORD}
      PATRONI_WAL_RESTORE_METHOD: pgbackrest
    volumes:
      - patroni1_data:/var/lib/postgresql/data
      - ./patroni/patroni-1.yml:/etc/patroni/patroni.yml:ro
      - ./patroni/post_bootstrap.sh:/etc/patroni/post_bootstrap.sh:ro
      - ./db/sigec_ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql:ro
      - ./db/sigec_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - pgbackrest_repo:/pgbackrest
    depends_on:
      - etcd
    command: >
      sh -c "
      apt-get update && apt-get install -y pgbackrest python3-pip &&
      pip install --break-system-packages 'patroni[etcd3]' psycopg2-binary &&
      mkdir -p /var/lib/postgresql/data/pgdata /pgbackrest &&
      chown -R postgres:postgres /var/lib/postgresql/data /pgbackrest &&
      chmod 700 /var/lib/postgresql/data/pgdata &&
      gosu postgres patroni /etc/patroni/patroni.yml
      "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sigec -d sigecpj"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    cap_add:
      - NET_ADMIN

  patroni-2:
    image: postgres:16
    environment:
      POSTGRES_USER: sigec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      PATRONI_NAME: patroni-2
      PATRONI_SCOPE: sigec-cluster
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni-2:8008
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni-2:5432
      PATRONI_ETCD3_HOST: etcd
      PATRONI_ETCD3_PORT: 2379
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD}
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: ${REPLICATOR_PASSWORD}
      PATRONI_WAL_RESTORE_METHOD: pgbackrest
    volumes:
      - patroni2_data:/var/lib/postgresql/data
      - ./patroni/patroni-2.yml:/etc/patroni/patroni.yml:ro
      - ./patroni/post_bootstrap.sh:/etc/patroni/post_bootstrap.sh:ro
      - ./db/sigec_ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql:ro
      - ./db/sigec_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - pgbackrest_repo:/pgbackrest
    depends_on:
      - etcd
    command: >
      sh -c "
      apt-get update && apt-get install -y pgbackrest python3-pip &&
      pip install --break-system-packages 'patroni[etcd3]' psycopg2-binary &&
      mkdir -p /var/lib/postgresql/data/pgdata /pgbackrest &&
      chown -R postgres:postgres /var/lib/postgresql/data /pgbackrest &&
      chmod 700 /var/lib/postgresql/data/pgdata &&
      gosu postgres patroni /etc/patroni/patroni.yml
      "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sigec -d sigecpj"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    cap_add:
      - NET_ADMIN

  # ---------------------------------------------------------------------------
  #  HAProxy: balanceador + terminación TLS
  #    - Puerto 5000 → primario (escritura)
  #    - Puerto 5001 → réplicas (lectura)
  #    - Puerto 8443 → frontend (HTTPS)
  # ---------------------------------------------------------------------------
  haproxy:
    image: haproxy:lts
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./haproxy/certs:/usr/local/etc/haproxy/certs:ro
    ports:
      - "5000:5000"   # primario (escritura)
      - "5001:5001"   # réplicas (lectura)
      - "8443:8443"   # frontend HTTPS
      - "7000:7000"   # stats HAProxy
    depends_on:
      - patroni-1
      - patroni-2
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/5000' && bash -c '</dev/tcp/localhost/5001'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  #  Backend Spring Boot × 2 (active-active)
  # ---------------------------------------------------------------------------
  backend-1:
    build: ./backend
    depends_on:
      haproxy:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://haproxy:5000/sigecpj
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AES_KEY: ${AES_KEY}
      SIGEC_BOOTSTRAP_ADMIN: "true"
      SERVER_PORT: 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  backend-2:
    build: ./backend
    depends_on:
      haproxy:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://haproxy:5000/sigecpj
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AES_KEY: ${AES_KEY}
      SIGEC_BOOTSTRAP_ADMIN: "true"
      SERVER_PORT: 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  #  Frontend Vue.js + nginx
  # ---------------------------------------------------------------------------
  frontend:
    build: ./frontend
    depends_on:
      - backend-1
      - backend-2
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./haproxy/certs:/etc/nginx/certs:ro
    ports:
      - "8088:80"
    restart: unless-stopped

volumes:
  etcd_data:
  patroni1_data:
  patroni2_data:
  pgbackrest_repo:
