# =============================================================================
# SIGEC-PJ — Topología local de alta disponibilidad
#   - etcd x3: quorum tolerante a la pérdida de un miembro
#   - PostgreSQL 16 + Patroni x3: 1 líder, 1 réplica síncrona, 1 réplica adicional
#   - HAProxy: escritura 5000, lectura 5001, aplicación HTTPS 8443
#   - Spring Boot x2 y frontend Vue/nginx
# =============================================================================

services:
  cert-generator:
    image: alpine/openssl
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ ! -s /certs/selfsigned.pem ]; then
        openssl req -x509 -newkey rsa:2048
        -keyout /tmp/key.pem -out /tmp/cert.pem
        -sha256 -days 365 -nodes -subj '/CN=localhost'
        -addext 'subjectAltName=DNS:localhost,DNS:haproxy' &&
        cat /tmp/cert.pem /tmp/key.pem > /certs/selfsigned.pem;
        fi
    volumes:
      - ./haproxy/certs:/certs
    restart: "no"

  etcd-1:
    image: quay.io/coreos/etcd:v3.5.13
    environment:
      ETCD_NAME: etcd-1
      ETCD_DATA_DIR: /etcd
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-1:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-1:2379
      ETCD_INITIAL_CLUSTER: etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: sigec-patroni-v2
      ETCD_AUTO_COMPACTION_MODE: periodic
      ETCD_AUTO_COMPACTION_RETENTION: 1h
    volumes:
      - etcd1_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  etcd-2:
    image: quay.io/coreos/etcd:v3.5.13
    environment:
      ETCD_NAME: etcd-2
      ETCD_DATA_DIR: /etcd
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-2:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-2:2379
      ETCD_INITIAL_CLUSTER: etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: sigec-patroni-v2
      ETCD_AUTO_COMPACTION_MODE: periodic
      ETCD_AUTO_COMPACTION_RETENTION: 1h
    volumes:
      - etcd2_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  etcd-3:
    image: quay.io/coreos/etcd:v3.5.13
    environment:
      ETCD_NAME: etcd-3
      ETCD_DATA_DIR: /etcd
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-3:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-3:2379
      ETCD_INITIAL_CLUSTER: etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: sigec-patroni-v2
      ETCD_AUTO_COMPACTION_MODE: periodic
      ETCD_AUTO_COMPACTION_RETENTION: 1h
    volumes:
      - etcd3_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  patroni-1:
    build: ./patroni
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD}
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: ${REPLICATOR_PASSWORD}
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_CIPHER}
    volumes:
      - patroni1_data:/var/lib/postgresql/data
      - ./patroni/patroni-1.yml:/etc/patroni/patroni.yml:ro
      - ./patroni/post_bootstrap.sh:/etc/patroni/post_bootstrap.sh:ro
      - ./db/sigec_ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql:ro
      - ./db/sigec_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - pgbackrest_repo:/pgbackrest
    depends_on:
      etcd-1: { condition: service_healthy }
      etcd-2: { condition: service_healthy }
      etcd-3: { condition: service_healthy }
    command: >
      sh -c "mkdir -p /var/lib/postgresql/data/pgdata /pgbackrest /var/log/pgbackrest &&
      chown -R postgres:postgres /var/lib/postgresql/data /pgbackrest /var/log/pgbackrest &&
      chmod 700 /var/lib/postgresql/data/pgdata &&
      exec gosu postgres patroni /etc/patroni/patroni.yml"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d sigecpj"]
      interval: 3s
      timeout: 2s
      retries: 30
    stop_grace_period: 8s
    restart: unless-stopped

  patroni-2:
    build: ./patroni
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD}
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: ${REPLICATOR_PASSWORD}
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_CIPHER}
    volumes:
      - patroni2_data:/var/lib/postgresql/data
      - ./patroni/patroni-2.yml:/etc/patroni/patroni.yml:ro
      - ./patroni/post_bootstrap.sh:/etc/patroni/post_bootstrap.sh:ro
      - ./db/sigec_ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql:ro
      - ./db/sigec_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - pgbackrest_repo:/pgbackrest
    depends_on:
      etcd-1: { condition: service_healthy }
      etcd-2: { condition: service_healthy }
      etcd-3: { condition: service_healthy }
    command: >
      sh -c "mkdir -p /var/lib/postgresql/data/pgdata /pgbackrest /var/log/pgbackrest &&
      chown -R postgres:postgres /var/lib/postgresql/data /pgbackrest /var/log/pgbackrest &&
      chmod 700 /var/lib/postgresql/data/pgdata &&
      exec gosu postgres patroni /etc/patroni/patroni.yml"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d sigecpj"]
      interval: 3s
      timeout: 2s
      retries: 30
    stop_grace_period: 8s
    restart: unless-stopped

  patroni-3:
    build: ./patroni
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD}
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: ${REPLICATOR_PASSWORD}
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_CIPHER}
    volumes:
      - patroni3_data:/var/lib/postgresql/data
      - ./patroni/patroni-3.yml:/etc/patroni/patroni.yml:ro
      - ./patroni/post_bootstrap.sh:/etc/patroni/post_bootstrap.sh:ro
      - ./db/sigec_ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql:ro
      - ./db/sigec_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - pgbackrest_repo:/pgbackrest
    depends_on:
      etcd-1: { condition: service_healthy }
      etcd-2: { condition: service_healthy }
      etcd-3: { condition: service_healthy }
    command: >
      sh -c "mkdir -p /var/lib/postgresql/data/pgdata /pgbackrest /var/log/pgbackrest &&
      chown -R postgres:postgres /var/lib/postgresql/data /pgbackrest /var/log/pgbackrest &&
      chmod 700 /var/lib/postgresql/data/pgdata &&
      exec gosu postgres patroni /etc/patroni/patroni.yml"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d sigecpj"]
      interval: 3s
      timeout: 2s
      retries: 30
    stop_grace_period: 8s
    restart: unless-stopped

  haproxy:
    image: haproxy:lts
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./haproxy/certs:/usr/local/etc/haproxy/certs:ro
    ports:
      - "5000:5000"
      - "5001:5001"
      - "8443:8443"
      - "7000:7000"
    depends_on:
      cert-generator: { condition: service_completed_successfully }
      patroni-1: { condition: service_started }
      patroni-2: { condition: service_started }
      patroni-3: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/5000' && bash -c '</dev/tcp/localhost/5001'"]
      interval: 3s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  backend-1:
    build: ./backend
    depends_on:
      haproxy: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://haproxy:5000/sigecpj
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AES_KEY: ${AES_KEY}
      SIGEC_BOOTSTRAP_ADMIN: "true"
      SERVER_PORT: 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 45s
    restart: unless-stopped

  backend-2:
    build: ./backend
    depends_on:
      haproxy: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://haproxy:5000/sigecpj
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AES_KEY: ${AES_KEY}
      SIGEC_BOOTSTRAP_ADMIN: "true"
      SERVER_PORT: 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 45s
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend-1: { condition: service_started }
      backend-2: { condition: service_started }
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8088:80"
    restart: unless-stopped

volumes:
  etcd1_data:
  etcd2_data:
  etcd3_data:
  patroni1_data:
  patroni2_data:
  patroni3_data:
  pgbackrest_repo:
