# =============================================================================
#  Patroni configuration for node 2 (patroni-2)
#  SIGEC-PJ Fase 3 — PostgreSQL HA Cluster
# =============================================================================

scope: sigec-cluster
name: patroni-2

restapi:
  listen: 0.0.0.0:8008
  connect_address: patroni-2:8008

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    synchronous_mode: true
    postgresql:
      use_pg_rewind: true
      parameters:
        wal_level: replica
        hot_standby: "on"
  initdb:
    - encoding: UTF8
    - data-checksums
  pg_hba:
    - host all all 0.0.0.0/0 scram-sha-256
    - host replication replicator 0.0.0.0/0 scram-sha-256
  post_bootstrap: sh /etc/patroni/post_bootstrap.sh

postgresql:
  listen: 0.0.0.0:5432
  connect_address: patroni-2:5432
  data_dir: /var/lib/postgresql/data/pgdata
  bin_dir: /usr/lib/postgresql/16/bin

  authentication:
    replication:
      username: replicator
      password: ${REPLICATOR_PASSWORD}
    superuser:
      username: postgres
      password: ${POSTGRES_PASSWORD}

  create_replica_methods:
    - basebackup

  pg_hba:
    - host all all 0.0.0.0/0 scram-sha-256
    - host replication replicator 0.0.0.0/0 scram-sha-256

  parameters:
    max_connections: 200
    shared_buffers: 256MB
    effective_cache_size: 1GB
    maintenance_work_mem: 64MB
    checkpoint_completion_target: 0.9
    wal_buffers: 16MB
    default_statistics_target: 100
    random_page_cost: 1.1
    effective_io_concurrency: 200
    work_mem: 2621kB
    min_wal_size: 1GB
    max_wal_size: 4GB

    # Replicación síncrona para RPO = 0 (synchronous_standby_names lo gestiona Patroni vía synchronous_mode)
    synchronous_commit: on

    # WAL archiving con pgBackRest
    archive_mode: on
    archive_command: pgbackrest archive-push %p

    # Logging
    logging_collector: on
    log_destination: stderr
    log_line_prefix: '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false

etcd3:
  host: etcd
  port: 2379