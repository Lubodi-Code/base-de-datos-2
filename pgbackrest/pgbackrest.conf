# =============================================================================
#  pgBackRest configuration for SIGEC-PJ HA
#  - Backup full diario
#  - WAL archiving continuo
#  - Repositorio local (para demo)
# =============================================================================

[global]
repo1-path=/pgbackrest
repo1-retention-full=7
repo1-retention-diff=30
process-max=2
log-level-console=info
log-path=/var/log/pgbackrest
start-fast=y
delta=y

# Stanza para la base de datos sigecpj
[sigecpj]
pg1-path=/var/lib/postgresql/data/pgdata
pg1-port=5432
pg1-user=postgres

# Backup settings
repo1-cipher-type=aes-256-cbc

# Compression
compress-type=gz
compress-level=6
